<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex,nofollow" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none';" />
  <title>DocFlow Shared Note</title>
  <style>
    :root {
      --bg: #F4F5F7;
      --surface: #FFFFFF;
      --text: #111317;
      --secondary: #5C6069;
      --divider: #E3E4E7;
      --accent: #1F6BFF;
      --danger: #DC2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111317;
        --surface: #1B1D20;
        --text: #F4F5F7;
        --secondary: #9CA3AF;
        --divider: #2A2D32;
        --accent: #3B82F6;
        --danger: #EF4444;
      }
    }
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .card {
      max-width: 640px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--divider);
      border-radius: 24px;
      padding: 24px;
    }
    .badge {
      font-size: 12px;
      color: var(--secondary);
      margin-bottom: 8px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 12px 0;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.5;
      margin: 16px 0;
    }
    .btn {
      display: inline-block;
      height: 48px;
      line-height: 48px;
      padding: 0 20px;
      border-radius: 24px;
      background: var(--accent);
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    .error {
      color: var(--danger);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge" id="note-meta">DocFlow Client-Side Shared Note • Processed in Browser</div>
    <h1 id="note-title">Loading note...</h1>
    <pre id="note-body"></pre>
    <a class="btn" id="open-app-btn" href="docflow://note">Open in DocFlow</a>
  </div>
  <script>
    (function () {
      const titleEl = document.getElementById('note-title');
      const bodyEl = document.getElementById('note-body');
      const metaEl = document.getElementById('note-meta');
      const hash = window.location.hash || '';
      if (!hash.startsWith('#v1.') || hash.length < 6) {
        titleEl.textContent = 'This link is invalid';
        titleEl.className = 'error';
        bodyEl.textContent = 'The shared note link is malformed, expired, or has been tampered with.';
        return;
      }
      metaEl.textContent = 'Decoded locally from URL fragment (#v1) • Never sent to server';
      titleEl.textContent = 'Protected DocFlow Note';
      bodyEl.textContent = 'Open this link in DocFlow to view, decrypt, or save this note on your device.';
      document.getElementById('open-app-btn').setAttribute('href', window.location.href);
    })();
  </script>
</body>
</html>
